<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بسملة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Readex+Pro:wght@300;400;500&display=swap">
<style>
:root{
  --bg1:#FFF3F7; --bg2:#EBDDFB; --ink:#3A2352; --soft:#7A5F96;
  --rose:#F28FAB; --lilac:#B79AE8; --gold:#F4C86A; --card:rgba(255,255,255,.7);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#2A1A3F; --bg2:#1B1030; --ink:#FFEAF2; --soft:#C9B3E6; --card:rgba(255,255,255,.08); color-scheme:dark;
  }
}
:root[data-theme="dark"]{--bg1:#2A1A3F; --bg2:#1B1030; --ink:#FFEAF2; --soft:#C9B3E6; --card:rgba(255,255,255,.08); color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:radial-gradient(120% 90% at 50% 0%,var(--bg1),var(--bg2));
  color:var(--ink); font-family:"Readex Pro","Segoe UI",Tahoma,sans-serif;
  display:flex; align-items:center; justify-content:center; overflow-x:hidden;
}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;z-index:1;width:min(92vw,520px);text-align:center;padding:24px 0}

/* the bud */
.bud{
  position:relative;width:190px;height:190px;margin:0 auto;border:0;background:none;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.bud:focus-visible{outline:3px solid var(--lilac);outline-offset:8px;border-radius:50%}
.petal{
  position:absolute;left:50%;bottom:50%;width:44px;height:92px;margin-left:-22px;
  border-radius:50% 50% 50% 50% / 85% 85% 15% 15%;
  transform-origin:50% 100%;
  transform:rotate(calc(var(--i)*9deg - 31deg)) scale(.55);
  background:linear-gradient(to top,var(--rose),#FFC6D6);
  transition:transform 1.4s cubic-bezier(.2,.9,.25,1.15);
  transition-delay:calc(var(--i)*60ms);
}
.petal:nth-child(even){background:linear-gradient(to top,var(--lilac),#E3D4FA)}
.core{
  position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#FFE9A8,var(--gold));transition:transform 1s .5s;
}
.bud:not(.open){animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.open .petal{transform:rotate(calc(var(--i)*45deg)) scale(1)}
.open .core{transform:scale(1.25)}

.hint{margin:22px 0 0;color:var(--soft);font-weight:300;font-size:1.05rem}
.open ~ .hint,body.open .hint{display:none}

/* revealed content */
.reveal{display:none}
body.open .reveal{display:block}
h1{
  font-family:"Aref Ruqaa","Amiri",serif;font-weight:700;margin:18px 0 6px;line-height:1.25;
  font-size:clamp(4.2rem,22vw,8rem);color:var(--ink);
  clip-path:inset(0 0 0 100%);
}
body.open h1{animation:write 2s .6s cubic-bezier(.5,0,.2,1) forwards}
@keyframes write{to{clip-path:inset(0 0 0 0)}}
.sub{margin:0 0 26px;color:var(--soft);font-weight:300;line-height:1.9;opacity:0}
body.open .sub{animation:fade 1s 2.4s forwards}
@keyframes fade{to{opacity:1}}
.wish{
  background:var(--card);border-radius:22px;padding:26px 22px;min-height:112px;
  display:flex;align-items:center;justify-content:center;
  font-size:1.2rem;line-height:2;font-weight:400;opacity:0;
  backdrop-filter:blur(6px);
}
body.open .wish{animation:fade 1s 2.8s forwards}
.wish span{transition:opacity .35s}
.wish span.out{opacity:0}
.next{
  margin-top:18px;font:inherit;font-size:1rem;color:#fff;background:var(--ink);
  border:0;border-radius:99px;padding:12px 28px;cursor:pointer;opacity:0;
}
:root:not([data-theme="light"]) .next{color:var(--bg2);}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .next{color:#fff}}
body.open .next{animation:fade 1s 3.1s forwards}
.next:focus-visible{outline:3px solid var(--lilac);outline-offset:4px}
.from{margin:26px 0 0;color:var(--soft);font-weight:300;opacity:0}
body.open .from{animation:fade 1s 3.4s forwards}

@media (prefers-reduced-motion:reduce){
  .bud:not(.open){animation:none}
  .petal,.core{transition:none}
  body.open h1,body.open .sub,body.open .wish,body.open .next,body.open .from{animation-duration:.01s;animation-delay:0s}
}
</style>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<main>
  <button class="bud" id="bud" aria-label="افتحي الهدية">
    <i class="petal" style="--i:0"></i><i class="petal" style="--i:1"></i><i class="petal" style="--i:2"></i><i class="petal" style="--i:3"></i>
    <i class="petal" style="--i:4"></i><i class="petal" style="--i:5"></i><i class="petal" style="--i:6"></i><i class="petal" style="--i:7"></i>
    <i class="core"></i>
  </button>
  <p class="hint">في حاجة مستنياكي جوه الوردة. اضغطي عليها</p>

  <section class="reveal">
    <h1>بسملة</h1>
    <p class="sub">اسمك معناه «بسم الله»، يعني البداية الحلوة.<br>وإنتِ فعلًا بداية أي يوم أحلى.</p>
    <div class="wish" aria-live="polite"><span id="wishText"></span></div>
    <button class="next" id="next">أمنية تانية</button>
    <p class="from" id="from"></p>
  </section>
</main>

<script>
// عدّلي الكلام ده براحتك
const SENDER = "من فرووس";
const WISHES = [
  "ربنا يسعد قلبك دايمًا ويحط في طريقك ناس زيك.",
  "ضحكتك بتنوّر أي يوم تقيل. خليكي زي ما إنتِ.",
  "أحلامك كلها قريبة، وربنا يرزقك اللي يفرّحك من غير ما تتعبي.",
  "كل حاجة بتبدئيها بـ«بسم الله» بتتبارك بإذن الله.",
  "وجودك في حياتي نعمة، شكرًا إنك صاحبتي."
];

const bud = document.getElementById('bud');
const wishText = document.getElementById('wishText');
const nextBtn = document.getElementById('next');
document.getElementById('from').textContent = SENDER;
let idx = 0;
wishText.textContent = WISHES[0];

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, parts = [], running = false, ambient = false, last = 0;
const COLORS = ['#F28FAB','#FFC6D6','#B79AE8','#E3D4FA','#F4C86A'];

function size(){
  const d = devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  cv.width = W*d; cv.height = H*d; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize', size); size();

function petal(x, y, burst){
  const a = Math.random()*Math.PI*2, s = burst ? 3 + Math.random()*7 : 0;
  parts.push({
    x, y, vx: Math.cos(a)*s, vy: burst ? Math.sin(a)*s - 3 : 0.6 + Math.random()*0.8,
    r: 5 + Math.random()*7, rot: Math.random()*6, vr: (Math.random()-.5)*0.08,
    sw: Math.random()*6, c: COLORS[Math.floor(Math.random()*COLORS.length)]
  });
}

function tick(t){
  const dt = Math.min(2, (t - last)/16.7 || 1); last = t;
  ctx.clearRect(0,0,W,H);
  if (ambient && parts.length < 36 && Math.random() < 0.08*dt) petal(Math.random()*W, -12, false);
  parts = parts.filter(p => p.y < H + 20 && p.x > -40 && p.x < W + 40);
  for (const p of parts){
    p.vx *= 0.985; p.vy = Math.min(p.vy + 0.12*dt, 1.8);
    p.sw += 0.03*dt;
    p.x += (p.vx + Math.sin(p.sw)*0.6)*dt; p.y += p.vy*dt; p.rot += p.vr*dt;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.c; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.ellipse(0,0,p.r*0.55,p.r,0,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }
  requestAnimationFrame(tick);
}

function open(){
  if (document.body.classList.contains('open')) return;
  bud.classList.add('open');
  bud.setAttribute('aria-label','الوردة اتفتحت');
  const r = bud.getBoundingClientRect();
  document.body.classList.add('open');
  if (reduce) return;
  for (let i=0;i<70;i++) petal(r.left + r.width/2, r.top + r.height/2, true);
  ambient = true;
  if (!running){ running = true; requestAnimationFrame(tick); }
}
bud.addEventListener('click', open);

nextBtn.addEventListener('click', () => {
  idx = (idx + 1) % WISHES.length;
  wishText.classList.add('out');
  setTimeout(() => { wishText.textContent = WISHES[idx]; wishText.classList.remove('out'); }, 350);
  if (!reduce){
    const r = nextBtn.getBoundingClientRect();
    for (let i=0;i<14;i++) petal(r.left + r.width/2, r.top, true);
  }
});
</script>
</body>
</html>
